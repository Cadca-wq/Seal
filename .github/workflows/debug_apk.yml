name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches-ignore: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3

      # Optional: a fixed debug keystore (base64 in the DEBUG_KEYSTORE_B64 secret)
      # so each new build installs over the previous one. Without it, every run
      # gets a fresh debug key and you must uninstall "Seal Debug" first.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        if: env.DEBUG_KEYSTORE_B64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - run: gradle assembleGenericDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: seal-debug-apks
          path: app/build/outputs/apk/generic/debug/*.apk
          if-no-files-found: error
          retention-days: 14
